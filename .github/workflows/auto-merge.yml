name: Auto-merge pull requests

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: false

jobs:
  enable:
    if: github.repository_owner == 'howells'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Metadata only: never check out or execute pull-request code.
      - name: Enable auto-merge under the existing branch rules
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          repository="$(gh api "repos/$REPO")"
          base="$(jq -er '.default_branch' <<<"$repository")"
          if ! jq -e --arg repo "$REPO" --arg base "$base" '
            .state == "open" and .draft == false and
            .base.repo.full_name == $repo and .base.ref == $base
          ' <<<"$pr" >/dev/null; then
            echo "Only open, ready PRs targeting the default branch are eligible."
            exit 0
          fi
          if jq -e '.auto_merge != null' <<<"$pr" >/dev/null; then
            echo "Auto-merge is already enabled."
            exit 0
          fi
          if [ "$(jq -r '.mergeable' <<<"$pr")" = false ]; then
            echo "The PR has merge conflicts; a new push will recheck it."
            exit 0
          fi
          if jq -e '.allow_squash_merge' <<<"$repository" >/dev/null; then
            method=--squash
          elif jq -e '.allow_merge_commit' <<<"$repository" >/dev/null; then
            method=--merge
          elif jq -e '.allow_rebase_merge' <<<"$repository" >/dev/null; then
            method=--rebase
          else
            echo "No merge method is enabled." >&2
            exit 1
          fi
          sha="$(jq -er '.head.sha' <<<"$pr")"
          gh pr merge "$PR_NUMBER" --repo "$REPO" "$method" --auto --match-head-commit "$sha"
